name: Bug report
description: Report something that did not work as expected in the public beta.
title: "bug: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for testing Noesis. Remove credentials, private session content, and other secrets before attaching logs or configuration.
  - type: input
    id: version
    attributes:
      label: Noesis version
      description: Run `npm list --global noesisai --depth=0` if you are unsure.
      placeholder: noesisai@0.0.1
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Include your operating system, terminal, and Node.js version.
      placeholder: macOS 15, Ghostty, Node.js 24.7.0
    validations:
      required: true
  - type: dropdown
    id: provider
    attributes:
      label: Model provider
      options:
        - OpenAI Codex
        - Anthropic
        - OpenRouter
        - OpenCode Zen
        - OpenCode Go
        - Not provider-specific
        - Other
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction
      description: What did you do, what happened, and what did you expect instead?
      placeholder: |
        1. Start Noesis with ...
        2. Enter ...
        3. Observe ...
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Relevant evidence
      description: Add redacted errors, screenshots, or the smallest useful trace excerpt.
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I removed credentials, private session content, and other secrets.
          required: true
